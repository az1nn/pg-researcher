[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pg-researcher"
version = "0.3.0"
description = "Evidence-first research skill and pipeline for Prince' Gutt"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary research workflow" }
authors = [{ name = "PG Influencer RESEARCH" }]
dependencies = [
  "httpx>=0.28,<1",
  "jsonschema[format]>=4.23,<5",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0.2,<7",
  "typer>=0.12.5,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<9",
  "ruff>=0.7,<1",
]

[project.scripts]
pg-researcher = "pg_researcher.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pg_researcher"]

[tool.hatch.build.targets.wheel.force-include]
"config/fetch-policy.yaml" = "pg_researcher/resources/fetch-policy.yaml"
"config/sources.yaml" = "pg_researcher/resources/sources.yaml"
"schemas/claim.schema.json" = "pg_researcher/resources/claim.schema.json"
"schemas/evidence.schema.json" = "pg_researcher/resources/evidence.schema.json"
"schemas/knowledge-index.schema.json" = "pg_researcher/resources/knowledge-index.schema.json"
"schemas/research-report.schema.json" = "pg_researcher/resources/research-report.schema.json"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
