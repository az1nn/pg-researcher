name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Build wheel
        run: python -m build --wheel
      - name: Verify packaged research resources
        run: |
          unzip -l dist/*.whl | grep 'pg_researcher/resources/fetch-policy.yaml'
          unzip -l dist/*.whl | grep 'pg_researcher/resources/sources.yaml'
          unzip -l dist/*.whl | grep 'pg_researcher/resources/evidence.schema.json'
          unzip -l dist/*.whl | grep 'pg_researcher/resources/research-report.schema.json'
